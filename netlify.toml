[build]
  command = "npm run build:client"
  publish = "dist/spa"

[dev]
  command = "pnpm dev"
  targetPort = 8080
  port = 8888
  autoLaunch = false

# Note: For production on Netlify, you'll need to re-add the functions folder
# and configure the github-proxy function. For local dev, Express handles this.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
